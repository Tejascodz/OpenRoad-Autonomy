name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for the secret scan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -q
      - name: SAST (bandit)
        run: bandit -q -r app scripts
      - name: Dependency CVEs (pip-audit)
        run: pip-audit -r requirements.txt -r requirements-postgres.txt
      - name: Secret scan (full git history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
